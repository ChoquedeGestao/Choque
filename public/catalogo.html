<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogo da loja</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #102733;
        background: #f3f7fa;
        --primary: #0f2733;
        --secondary: #0e7a5f;
        --accent: #f7bd16;
        --line: #dbe7ed;
        --muted: #546a75;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f3f7fa;
      }

      .hero {
        min-height: 320px;
        background: linear-gradient(135deg, var(--primary), #183f50);
        color: #fff;
        display: grid;
        align-items: end;
        padding: 28px;
        position: relative;
        overflow: hidden;
      }

      .hero.has-cover {
        background: var(--primary);
      }

      .hero.has-cover::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(15, 39, 51, 0.82), rgba(15, 39, 51, 0.28));
        z-index: 1;
      }

      .hero-slides {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .hero-slide {
        position: absolute;
        inset: 0;
        background-position: center;
        background-size: cover;
        opacity: 0;
        transform: scale(1.02);
        transition: opacity 0.7s ease, transform 3.5s ease;
      }

      .hero-slide.active {
        opacity: 1;
        transform: scale(1);
      }

      .hero-content {
        width: min(1120px, 100%);
        margin: 0 auto;
        position: relative;
        z-index: 2;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
      }

      .logo {
        width: 62px;
        height: 62px;
        border-radius: 8px;
        background: var(--accent);
        color: var(--primary);
        display: grid;
        place-items: center;
        font-weight: 900;
        overflow: hidden;
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 72px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .hero p {
        max-width: 680px;
        margin: 18px 0 0;
        color: rgba(255, 255, 255, 0.86);
        font-size: 18px;
        line-height: 1.45;
      }

      .shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }

      .toolbar {
        margin-top: -34px;
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px 220px;
        gap: 12px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        box-shadow: 0 20px 50px rgba(16, 39, 51, 0.12);
      }

      input,
      select {
        width: 100%;
        border: 1px solid #cbd9df;
        border-radius: 7px;
        padding: 13px 14px;
        background: #fff;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        padding: 28px 0 46px;
      }

      .product {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      .photo {
        position: relative;
        aspect-ratio: 4 / 3;
        background: #f8fbfc;
        display: grid;
        place-items: center;
        color: var(--muted);
        overflow: hidden;
      }

      .photo img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        padding: 0;
        opacity: 0;
        transition: opacity 0.35s ease;
      }

      .photo img.active {
        opacity: 1;
      }

      .photo .image-warning {
        position: relative;
        z-index: 1;
        max-width: 82%;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
        text-align: center;
      }

      .tag {
        position: absolute;
        top: 12px;
        right: 12px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--primary);
        padding: 7px 10px;
        font-weight: 900;
        font-size: 12px;
      }

      .body {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
      }

      .category {
        color: var(--muted);
        font-size: 13px;
      }

      .product h2 {
        margin: 0;
        font-size: 22px;
        line-height: 1.1;
      }

      .price {
        color: var(--secondary);
        font-size: 24px;
        font-weight: 900;
      }

      .description {
        color: #344a54;
        line-height: 1.45;
        flex: 1;
      }

      .button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 46px;
        border: 0;
        border-radius: 7px;
        background: var(--secondary);
        color: #fff;
        text-decoration: none;
        font-weight: 900;
        padding: 12px 14px;
        cursor: pointer;
      }

      .button.secondary {
        background: #e7eef2;
        color: var(--primary);
      }

      .cart-panel {
        margin-top: 16px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        box-shadow: 0 12px 30px rgba(16, 39, 51, 0.08);
      }

      .cart-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(15, 39, 51, 0.62);
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .modal-card {
        width: min(760px, 100%);
        max-height: min(760px, calc(100vh - 36px));
        overflow: auto;
        background: #fff;
        border-radius: 8px;
        border: 1px solid var(--line);
        box-shadow: 0 30px 80px rgba(16, 39, 51, 0.28);
      }

      .modal-header,
      .modal-footer {
        padding: 18px;
        border-bottom: 1px solid var(--line);
      }

      .modal-header h2 {
        margin: 0;
      }

      .modal-body {
        padding: 18px;
      }

      .modal-footer {
        border-top: 1px solid var(--line);
        border-bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .field-full {
        grid-column: 1 / -1;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 800;
        font-size: 14px;
      }

      textarea {
        width: 100%;
        min-height: 86px;
        resize: vertical;
        border: 1px solid #cbd9df;
        border-radius: 7px;
        padding: 13px 14px;
        font-family: inherit;
      }

      .order-list {
        margin: 0 0 16px;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }

      .order-list li {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .order-total {
        margin: 0 0 18px;
        font-size: 22px;
        font-weight: 900;
        color: var(--secondary);
      }

      .empty,
      .error {
        margin: 28px 0 46px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 22px;
        color: var(--muted);
      }

      .footer {
        border-top: 1px solid var(--line);
        background: #fff;
        padding: 22px 0;
        color: var(--muted);
      }

      .footer a {
        color: var(--secondary);
        font-weight: 800;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 860px) {
        .toolbar {
          grid-template-columns: 1fr;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .hero {
          min-height: 280px;
          padding: 22px 16px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .cart-panel,
        .order-list li {
          align-items: stretch;
          flex-direction: column;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header id="hero" class="hero">
      <div id="heroSlides" class="hero-slides" aria-hidden="true"></div>
      <div class="hero-content">
        <div class="brand">
          <div id="logo" class="logo">BT</div>
          <div>
            <strong id="storeName">Catalogo</strong>
            <div id="storeContact"></div>
          </div>
        </div>
        <h1 id="headline">Catalogo da loja</h1>
        <p>Escolha seus produtos e chame a loja pelo WhatsApp para concluir o pedido.</p>
      </div>
    </header>

    <main class="shell">
      <section class="toolbar" aria-label="Filtros do catalogo">
        <input id="searchInput" placeholder="Buscar no catalogo">
        <select id="categoryFilter">
          <option value="">Todas categorias</option>
        </select>
        <select id="subcategoryFilter">
          <option value="">Todas subcategorias</option>
        </select>
      </section>

      <section id="cartPanel" class="cart-panel hidden" aria-live="polite">
        <strong id="cartSummary">Carrinho vazio</strong>
        <div class="cart-actions">
          <button id="checkoutButton" class="button" type="button">Fechar pedido</button>
          <button id="clearCartButton" class="button secondary" type="button">Limpar carrinho</button>
        </div>
      </section>

      <section id="productsGrid" class="grid"></section>
      <div id="catalogMessage" class="empty">Carregando catalogo...</div>
    </main>

    <footer class="footer">
      <div class="shell" id="footerLinks"></div>
    </footer>

    <div id="checkoutModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle">
      <form id="checkoutForm" class="modal-card">
        <div class="modal-header">
          <h2 id="checkoutTitle">Fechar pedido</h2>
        </div>
        <div class="modal-body">
          <ul id="orderList" class="order-list"></ul>
          <p id="orderTotal" class="order-total"></p>
          <div class="form-grid">
            <label>
              Nome do comprador
              <input id="buyerName" required placeholder="Nome completo">
            </label>
            <label>
              WhatsApp do comprador
              <input id="buyerWhatsapp" required inputmode="tel" placeholder="DDD + numero">
            </label>
            <label class="field-full">
              Endereco de entrega
              <input id="buyerAddress" placeholder="Rua, numero, bairro e cidade">
            </label>
            <label class="field-full">
              Observacao
              <textarea id="buyerNotes" placeholder="Referencia, forma de entrega ou observacao para a loja"></textarea>
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button id="cancelCheckoutButton" class="button secondary" type="button">Continuar comprando</button>
          <button class="button" type="submit">Enviar pedido para WhatsApp e e-mail</button>
        </div>
      </form>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const loja = params.get("loja");
      const productsGrid = document.getElementById("productsGrid");
      const catalogMessage = document.getElementById("catalogMessage");
      const searchInput = document.getElementById("searchInput");
      const categoryFilter = document.getElementById("categoryFilter");
      const subcategoryFilter = document.getElementById("subcategoryFilter");
      const cartPanel = document.getElementById("cartPanel");
      const cartSummary = document.getElementById("cartSummary");
      const checkoutButton = document.getElementById("checkoutButton");
      const clearCartButton = document.getElementById("clearCartButton");
      const checkoutModal = document.getElementById("checkoutModal");
      const checkoutForm = document.getElementById("checkoutForm");
      const cancelCheckoutButton = document.getElementById("cancelCheckoutButton");
      const orderList = document.getElementById("orderList");
      const orderTotal = document.getElementById("orderTotal");
      let catalog = null;
      let cart = [];

      searchInput.addEventListener("input", renderProducts);
      categoryFilter.addEventListener("change", () => {
        renderSubcategoryOptions();
        renderProducts();
      });
      subcategoryFilter.addEventListener("change", renderProducts);
      productsGrid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-buy-product]");
        if (!button) return;
        startWhatsappPurchase(button.dataset.buyProduct);
      });
      checkoutButton.addEventListener("click", openCheckout);
      clearCartButton.addEventListener("click", clearCart);
      cancelCheckoutButton.addEventListener("click", () => checkoutModal.classList.add("hidden"));
      checkoutModal.addEventListener("click", (event) => {
        if (event.target === checkoutModal) checkoutModal.classList.add("hidden");
      });
      checkoutForm.addEventListener("submit", sendOrderToWhatsapp);

      loadCatalog();

      async function loadCatalog() {
        if (!loja) {
          showError("Link do catalogo incompleto.");
          return;
        }

        try {
          const response = await fetch(`/.netlify/functions/public-catalog?loja=${encodeURIComponent(loja)}`);
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Nao foi possivel abrir o catalogo.");
          }

          catalog = data;
          applyStore(data.configuracao || {}, data.empresa || {});
          renderCategoryOptions();
          renderProducts();
        } catch (error) {
          showError(error.message);
        }
      }

      function applyStore(settings, empresa) {
        const name = settings.nome_publico || empresa.nome || "Catalogo da loja";
        document.title = `${name} | Catalogo`;
        document.getElementById("storeName").textContent = name;
        document.getElementById("headline").textContent = name;

        setCssColor("--primary", settings.cor_primaria, "#0f2733");
        setCssColor("--secondary", settings.cor_secundaria, "#0e7a5f");
        setCssColor("--accent", settings.cor_destaque, "#f7bd16");

        const hero = document.getElementById("hero");
        const heroImages = uniqueUrls([
          ...imageList(settings.capa_url),
          ...featuredProductImages()
        ]).slice(0, 8);

        if (heroImages.length) {
          hero.classList.add("has-cover");
          renderHeroCarousel(heroImages);
        }

        const logo = document.getElementById("logo");
        const logoUrl = safeImageUrl(settings.logo_url);
        if (logoUrl) {
          logo.innerHTML = `<img src="${escapeHtml(logoUrl)}" alt="${escapeHtml(name)}">`;
        } else {
          logo.textContent = initials(name);
        }

        const contact = [];
        if (settings.whatsapp) contact.push(`WhatsApp: ${settings.whatsapp}`);
        if (settings.site) contact.push(settings.site);
        document.getElementById("storeContact").textContent = contact.join(" | ");

        const links = [];
        if (settings.site) links.push(`<a href="${safeUrl(settings.site)}" target="_blank" rel="noreferrer">Site</a>`);
        if (settings.instagram) links.push(`<a href="${instagramUrl(settings.instagram)}" target="_blank" rel="noreferrer">Instagram</a>`);
        if (settings.whatsapp) links.push(`<a href="${waUrl(settings.whatsapp, `Ola, vim pelo catalogo da ${name}.`)}" target="_blank" rel="noreferrer">WhatsApp</a>`);
        document.getElementById("footerLinks").innerHTML = links.length ? links.join(" &middot; ") : name;
      }

      function renderCategoryOptions() {
        const roots = (catalog.categorias || []).filter((category) => !category.parent_id);
        categoryFilter.innerHTML = '<option value="">Todas categorias</option>';
        roots.forEach((category) => {
          categoryFilter.insertAdjacentHTML("beforeend", `<option value="${category.id}">${escapeHtml(category.nome)}</option>`);
        });
        renderSubcategoryOptions();
      }

      function renderSubcategoryOptions() {
        const parentId = categoryFilter.value;
        const children = (catalog.categorias || []).filter((category) => category.parent_id && (!parentId || category.parent_id === parentId));
        subcategoryFilter.innerHTML = '<option value="">Todas subcategorias</option>';
        children.forEach((category) => {
          subcategoryFilter.insertAdjacentHTML("beforeend", `<option value="${category.id}">${escapeHtml(category.nome)}</option>`);
        });
      }

      function renderProducts() {
        const search = normalize(searchInput.value);
        const categoryId = categoryFilter.value;
        const subcategoryId = subcategoryFilter.value;
        const products = (catalog.produtos || []).filter((product) => {
          const productCategory = product.categoria_id || "";
          const productSubcategory = product.subcategoria_id || "";
          const categoryMatch = !categoryId || productCategory === categoryId;
          const subcategoryMatch = !subcategoryId || productSubcategory === subcategoryId;
          const text = normalize(`${product.nome} ${product.descricao || ""} ${categoryName(product.subcategoria_id) || categoryName(product.categoria_id)}`);
          return categoryMatch && subcategoryMatch && (!search || text.includes(search));
        });

        productsGrid.innerHTML = products.map(renderProduct).join("");
        catalogMessage.classList.toggle("hidden", products.length > 0);
        catalogMessage.textContent = products.length ? "" : "Nenhum produto encontrado para este filtro.";
        startCarousels();
      }

      function renderProduct(product) {
        const images = productImages(product);
        const category = categoryName(product.subcategoria_id) || categoryName(product.categoria_id) || "Produto";

        return `
          <article class="product">
            <div class="photo" data-carousel>
              ${images.length ? images.map((image, index) => `<img class="${index === 0 ? "active" : ""}" src="${escapeHtml(image)}" alt="${escapeHtml(product.nome)}" loading="lazy" onerror="imageLoadError(this)">`).join("") : '<span class="image-warning">Sem imagem cadastrada</span>'}
              ${product.novidade ? '<span class="tag">Novidade</span>' : ""}
            </div>
            <div class="body">
              <div class="category">${escapeHtml(category)}</div>
              <h2>${escapeHtml(product.nome)}</h2>
              <div class="price">${formatMoney(product.preco)}</div>
              <div class="description">${escapeHtml(product.descricao || "Produto disponivel para consulta pelo WhatsApp.")}</div>
              <button class="button" type="button" data-buy-product="${escapeHtml(product.id)}">Comprar / adicionar ao pedido</button>
            </div>
          </article>
        `;
      }

      function startWhatsappPurchase(productId) {
        const product = (catalog.produtos || []).find((item) => item.id === productId);
        if (!product) {
          alert("Produto nao encontrado. Atualize o catalogo e tente novamente.");
          return;
        }

        const whatsapp = catalog.configuracao?.whatsapp || catalog.empresa?.telefone || "";
        if (!whatsapp) {
          alert("A loja ainda nao cadastrou WhatsApp para receber pedidos.");
          return;
        }

        const quantityText = prompt(`Quantidade para "${product.nome}":`, "1");
        if (quantityText === null) return;

        const quantity = Number(String(quantityText).replace(",", "."));
        if (!Number.isFinite(quantity) || quantity <= 0) {
          alert("Informe uma quantidade valida.");
          return;
        }

        addToCart(product, quantity);
        const keepBuying = confirm("Produto incluido no carrinho. Deseja continuar comprando?");
        if (!keepBuying) openCheckout();
      }

      function addToCart(product, quantity) {
        const existing = cart.find((item) => item.product.id === product.id);
        if (existing) {
          existing.quantity += quantity;
        } else {
          cart.push({ product, quantity });
        }
        updateCartPanel();
      }

      function updateCartPanel() {
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const total = cartTotal();
        cartPanel.classList.toggle("hidden", cart.length === 0);
        cartSummary.textContent = `${formatQuantity(totalItems)} item(ns) no carrinho - Total: ${formatMoney(total)}`;
      }

      function clearCart() {
        if (!cart.length) return;
        if (!confirm("Deseja limpar todos os produtos do carrinho?")) return;
        cart = [];
        updateCartPanel();
      }

      function openCheckout() {
        if (!cart.length) {
          alert("Inclua pelo menos um produto no carrinho.");
          return;
        }

        orderList.innerHTML = cart.map((item) => {
          const product = item.product;
          const subtotal = (Number(product.preco) || 0) * item.quantity;
          return `
            <li>
              <span>
                <strong>Produto: ${escapeHtml(product.nome)}</strong><br>
                Quantidade: ${formatQuantity(item.quantity)}<br>
                Preco unitario: ${formatMoney(product.preco)}
              </span>
              <strong>Total: ${formatMoney(subtotal)}</strong>
            </li>
          `;
        }).join("");
        orderTotal.textContent = `Total do pedido: ${formatMoney(cartTotal())}`;
        checkoutModal.classList.remove("hidden");
        document.getElementById("buyerName").focus();
      }

      function buildOrderMessage(buyer) {
        const storeName = catalog.configuracao?.nome_publico || catalog.empresa?.nome || "loja";
        const lines = cart.flatMap((item, index) => {
          const product = item.product;
          const unitPrice = Number(product.preco) || 0;
          const subtotal = unitPrice * item.quantity;
          const category = categoryName(product.subcategoria_id) || categoryName(product.categoria_id) || "Sem categoria";
          return [
            `${index + 1}. Produto: ${product.nome}`,
            `Categoria: ${category}`,
            `Quantidade: ${formatQuantity(item.quantity)}`,
            `Preco unitario: ${formatMoney(unitPrice)}`,
            `Total: ${formatMoney(subtotal)}`
          ];
        });

        return [
          `Ola, quero fechar um pedido na ${storeName}.`,
          "",
          `Comprador: ${buyer.name}`,
          `WhatsApp do comprador: ${buyer.whatsapp}`,
          buyer.address ? `Endereco: ${buyer.address}` : "",
          buyer.notes ? `Observacao: ${buyer.notes}` : "",
          "",
          "Resumo do pedido:",
          ...lines,
          "",
          `Valor total do pedido: ${formatMoney(cartTotal())}`,
          "",
          "Por favor, confirme a disponibilidade e a forma de entrega."
        ].filter(Boolean).join("\n");
      }

      function storeEmail() {
        return String(catalog.configuracao?.email || catalog.empresa?.email || "").trim();
      }

      function mailtoUrl(email, subject, body) {
        return `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      }

      function sendOrderToWhatsapp(event) {
        event.preventDefault();
        if (!cart.length) return;

        const buyer = {
          name: document.getElementById("buyerName").value.trim(),
          whatsapp: document.getElementById("buyerWhatsapp").value.trim(),
          address: document.getElementById("buyerAddress").value.trim(),
          notes: document.getElementById("buyerNotes").value.trim()
        };

        if (!buyer.name || !buyer.whatsapp) {
          alert("Informe nome e WhatsApp do comprador.");
          return;
        }

        const whatsapp = catalog.configuracao?.whatsapp || catalog.empresa?.telefone || "";
        if (!whatsapp) {
          alert("A loja ainda nao cadastrou WhatsApp para receber pedidos.");
          return;
        }

        const storeName = catalog.configuracao?.nome_publico || catalog.empresa?.nome || "loja";
        const message = buildOrderMessage(buyer);
        window.open(waUrl(whatsapp, message), "_blank", "noopener,noreferrer");
        const email = storeEmail();
        if (email) {
          window.setTimeout(() => {
            window.open(mailtoUrl(email, `Pedido recebido - ${storeName}`, message), "_blank", "noopener,noreferrer");
          }, 350);
          alert("Pedido preparado para WhatsApp e e-mail da loja. Confirme o envio nas janelas abertas.");
        } else {
          alert("Pedido preparado para WhatsApp. A loja ainda nao cadastrou e-mail para receber copia.");
        }
        checkoutModal.classList.add("hidden");
        checkoutForm.reset();
        cart = [];
        updateCartPanel();
      }

      function cartTotal() {
        return cart.reduce((sum, item) => sum + ((Number(item.product.preco) || 0) * item.quantity), 0);
      }

      function startCarousels() {
        document.querySelectorAll("[data-carousel]").forEach((carousel) => {
          const images = Array.from(carousel.querySelectorAll("img:not([data-failed])"));
          if (images.length <= 1 || carousel.dataset.started) return;
          carousel.dataset.started = "true";
          let index = 0;
          setInterval(() => {
            const currentImages = Array.from(carousel.querySelectorAll("img:not([data-failed])"));
            if (currentImages.length <= 1) return;
            if (index >= currentImages.length) index = 0;
            currentImages[index].classList.remove("active");
            index = (index + 1) % currentImages.length;
            currentImages[index].classList.add("active");
          }, 2600);
        });
      }

      function renderHeroCarousel(images) {
        const heroSlides = document.getElementById("heroSlides");
        heroSlides.innerHTML = images.map((image, index) => `
          <div class="hero-slide ${index === 0 ? "active" : ""}" style="background-image: url('${cssUrl(image)}')"></div>
        `).join("");

        if (images.length <= 1) return;

        let index = 0;
        setInterval(() => {
          const slides = Array.from(heroSlides.querySelectorAll(".hero-slide"));
          if (!slides.length) return;
          slides[index]?.classList.remove("active");
          index = (index + 1) % slides.length;
          slides[index]?.classList.add("active");
        }, 3600);
      }

      function featuredProductImages() {
        return (catalog.produtos || [])
          .filter((product) => product.ativo && product.novidade)
          .flatMap(productImages)
          .concat((catalog.produtos || []).filter((product) => product.ativo).flatMap(productImages));
      }

      function productImages(product) {
        return uniqueUrls([
          ...imageList(product.imagem_1),
          ...imageList(product.imagem_2),
          ...imageList(product.imagem_3),
          ...imageList(product.imagem_4)
        ]);
      }

      function imageList(value) {
        return String(value || "")
          .split(/[\n,;|]+/)
          .map(safeImageUrl)
          .filter(Boolean);
      }

      function safeImageUrl(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        if (/drive\.google\.com/i.test(text)) {
          const googleDriveMatch = text.match(/drive\.google\.com\/file\/d\/([^/]+)/i) || text.match(/[?&]id=([^&]+)/i);
          if (googleDriveMatch) return imageProxyUrl(`https://drive.google.com/uc?export=view&id=${googleDriveMatch[1]}`);
        }
        if (/dropbox\.com/i.test(text)) return imageProxyUrl(text.replace("www.dropbox.com", "dl.dropboxusercontent.com").replace("?dl=0", "").replace("?dl=1", ""));
        if (/^https?:\/\//i.test(text)) return imageProxyUrl(text);
        if (/^\/\//.test(text)) return imageProxyUrl(`https:${text}`);
        if (/^www\./i.test(text)) return imageProxyUrl(`https://${text}`);
        return "";
      }

      function imageProxyUrl(url) {
        return `/.netlify/functions/image-proxy?url=${encodeURIComponent(url)}`;
      }

      function imageLoadError(image) {
        image.dataset.failed = "true";
        image.classList.remove("active");
        image.removeAttribute("src");

        const carousel = image.closest("[data-carousel]");
        if (!carousel) return;

        const validImages = Array.from(carousel.querySelectorAll("img:not([data-failed])"));
        if (validImages.length) {
          validImages.forEach((item, index) => item.classList.toggle("active", index === 0));
          return;
        }

        if (!carousel.querySelector(".image-warning")) {
          carousel.insertAdjacentHTML("beforeend", '<span class="image-warning">Link informado nao abre como imagem direta.</span>');
        }
      }

      function uniqueUrls(values) {
        return [...new Set(values.filter(Boolean))];
      }

      function cssUrl(value) {
        return String(value || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
      }

      function categoryName(id) {
        return (catalog.categorias || []).find((category) => category.id === id)?.nome || "";
      }

      function waUrl(phone, message) {
        const digits = String(phone || "").replace(/\D/g, "");
        const number = digits.length <= 11 ? `55${digits}` : digits;
        return number ? `https://wa.me/${number}?text=${encodeURIComponent(message)}` : "#";
      }

      function safeUrl(url) {
        const value = String(url || "").trim();
        if (!value) return "#";
        return /^https?:\/\//i.test(value) ? value : `https://${value}`;
      }

      function instagramUrl(value) {
        const text = String(value || "").trim();
        if (/^https?:\/\//i.test(text)) return text;
        return `https://instagram.com/${text.replace(/^@/, "")}`;
      }

      function setCssColor(name, value, fallback) {
        const color = /^#[0-9a-f]{6}$/i.test(value || "") ? value : fallback;
        document.documentElement.style.setProperty(name, color);
      }

      function formatMoney(value) {
        const number = Number(value);
        return new Intl.NumberFormat("pt-BR", {
          style: "currency",
          currency: "BRL"
        }).format(Number.isFinite(number) ? number : 0);
      }

      function formatQuantity(value) {
        return new Intl.NumberFormat("pt-BR", {
          maximumFractionDigits: 3
        }).format(value);
      }

      function normalize(value) {
        return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }

      function initials(name) {
        return String(name || "BT").split(/\s+/).slice(0, 2).map((part) => part[0] || "").join("").toUpperCase();
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function showError(message) {
        productsGrid.innerHTML = "";
        catalogMessage.className = "error";
        catalogMessage.textContent = message;
      }
    </script>
  </body>
</html>
