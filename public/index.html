<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=/cadastro.html">
    <title>Choque de Gestao | Comece sua loja digital</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #102733;
        background: #eef5f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(14, 122, 95, 0.18), transparent 34rem),
          linear-gradient(135deg, #f8fbfc, #dfeef4);
      }

      .card {
        width: min(560px, 100%);
        background: #fff;
        border: 1px solid #d8e5eb;
        border-radius: 10px;
        padding: 32px;
        box-shadow: 0 24px 70px rgba(16, 39, 51, 0.14);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
      }

      .mark {
        width: 46px;
        height: 46px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: #f7bd16;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 12px 0 0;
        color: #4f6470;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 7px;
        font-weight: 700;
        text-decoration: none;
      }

      .primary {
        background: #0e7a5f;
        color: #fff;
      }

      .secondary {
        background: #e8f0f4;
        color: #102733;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <div class="mark">CG</div>
        <div>
          <h1>Choque de Gestao</h1>
          <p>Voce sera direcionado para iniciar sua adesao.</p>
        </div>
      </div>

      <p>Se a pagina nao abrir automaticamente, clique no botao abaixo.</p>

      <div class="actions">
        <a class="primary" href="/cadastro.html">Comecar cadastro</a>
        <a class="secondary" href="/admin.html">Acesso administrativo</a>
      </div>
    </main>

    <script>
      window.location.replace("/cadastro.html");
    </script>
  </body>
</html>
