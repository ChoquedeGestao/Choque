<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choque de Gestao | Plataforma Profissional</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #132027;
        background: #f4f7f8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(760px, 100%);
        border: 1px solid #d9e2e6;
        border-radius: 10px;
        background: #fff;
        padding: 28px;
        box-shadow: 0 18px 45px rgba(20, 34, 42, 0.12);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0 0 14px;
        color: #51636f;
        line-height: 1.5;
      }

      code {
        display: block;
        border: 1px solid #d9e2e6;
        border-radius: 8px;
        background: #f7fafb;
        padding: 12px;
        color: #0f4c81;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Projeto profissional iniciado</h1>
      <p>Esta sera a versao SaaS multi-loja da plataforma Choque de Gestao.</p>
      <p>Endpoint do webhook Asaas:</p>
      <code>/.netlify/functions/asaas-webhook</code>
    </main>
  </body>
</html>
